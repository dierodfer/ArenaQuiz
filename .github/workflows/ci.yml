name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: no ejecutar scripts de ciclo de vida de las
      # dependencias durante la instalación (superficie de supply chain).
      # Verificado: test y build funcionan sin ellos.
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build
